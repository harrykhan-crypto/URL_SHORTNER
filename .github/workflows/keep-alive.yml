name: Keep Alive (API + MongoDB)

# Pings the API health check once a day. /api/ping runs a database command,
# so this keeps the MongoDB Atlas free cluster from pausing for inactivity.
# Render's free tier still sleeps after ~15 min idle; the site shows a
# "Waking server" status while it starts.
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
# Variables -> New repository variable:
#   API_URL = https://YOUR-API.onrender.com

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health check
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL repository variable is not set; skipping."
            exit 0
          fi
          # A cold start can take ~1 minute, so retry before failing.
          curl --fail --silent --show-error --max-time 90 \
            --retry 5 --retry-delay 20 --retry-all-errors "${API_URL%/}/api/ping"
          echo
          echo "Pinged API at $(date -u)"
