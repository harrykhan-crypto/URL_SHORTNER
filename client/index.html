<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#F6F5F0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0E0E0C"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- CLARITY -->

    <title>MakeLink | Free URL Shortener</title>
    <meta
      name="description"
      content="Shorten any link in one click. Free, no sign-up, custom aliases, QR codes and click counts. Links expire after 90 days."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="MakeLink | Free URL Shortener" />
    <meta
      property="og:description"
      content="Shorten any link in one click. No sign-up, custom aliases and QR codes."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MakeLink | Free URL Shortener" />
    <meta
      name="twitter:description"
      content="Shorten any link in one click. No sign-up, custom aliases and QR codes."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MakeLink",
        "url": "__SITE_URL__/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A free URL shortener with custom aliases, QR codes and click counts."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
